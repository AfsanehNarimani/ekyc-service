services:
  ekyc-service:
    image: ekyc-service:local
    container_name: ekyc-service
    init: true

    env_file:
      - .env.docker

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./models/edgeface:/models/edgeface:ro
      - ./models/passive_liveness:/models/passive_liveness:ro
      - ${HOME}/.insightface/models/buffalo_l/det_10g.onnx:/models/insightface/models/buffalo_l/det_10g.onnx:ro
      - ${HOME}/.insightface/models/buffalo_l/1k3d68.onnx:/models/insightface/models/buffalo_l/1k3d68.onnx:ro

    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/data/tmp/media:size=512m,uid=999,gid=999
      - /app/data/references:size=64m,uid=999,gid=999
      - /app/data/embeddings:size=64m,uid=999,gid=999

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    restart: unless-stopped
    stop_grace_period: 30s